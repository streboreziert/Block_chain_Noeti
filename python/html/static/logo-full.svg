  <path d="M60 20 L60 60 M60 20 L54 20 M60 60 L54 60" stroke="#00ff88" stroke-width="1.5" stroke-linecap="square" opacity="0.5"/>
  <circle cx="36" cy="28" r="4" stroke="url(#g)" stroke-width="1.2" fill="#030806"/>
