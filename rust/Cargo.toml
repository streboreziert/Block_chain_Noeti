[workspace]
resolver = "2"
members = [
  "crates/noetis-chain",
  "crates/noetis-network",
  "crates/noetis-protocol",
  "crates/noetis-crypto",
  "crates/noetis-currency",
  "crates/noetis-blockchain",
  "crates/noetis-p2p",
  "crates/noetis-db",
  "crates/noetis-api",
  "crates/noetis-coordinator",
  "crates/noetis-validator",
  "crates/noetis-full-node",
  "crates/noetis-node",
  "crates/noetis-web",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip is required for wire compatibility: transaction signatures
# cover Python repr floats, so JSON floats must parse to the exact same f64.
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
crypto_box = { version = "0.9", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
mime_guess = "2"
open = "5"
ctrlc = "3"

noetis-chain = { path = "crates/noetis-chain" }

noetis-protocol = { path = "crates/noetis-protocol" }
noetis-crypto = { path = "crates/noetis-crypto" }
noetis-currency = { path = "crates/noetis-currency" }
noetis-blockchain = { path = "crates/noetis-blockchain" }
noetis-p2p = { path = "crates/noetis-p2p" }
noetis-db = { path = "crates/noetis-db" }
