<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Noeti Compute">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
  </defs>
  <!-- outer bracket frame -->
  <path d="M8 12 L8 52 M8 12 L14 12 M8 52 L14 52" stroke="#00ff88" stroke-width="2" stroke-linecap="square" opacity="0.6"/>
  <path d="M56 12 L56 52 M56 12 L50 12 M56 52 L50 52" stroke="#00ff88" stroke-width="2" stroke-linecap="square" opacity="0.6"/>
  <!-- mesh nodes -->
  <circle cx="32" cy="20" r="5" stroke="url(#g)" stroke-width="1.5" fill="#030806" filter="url(#glow)"/>
  <circle cx="20" cy="44" r="5" stroke="#00ff88" stroke-width="1.5" fill="#030806"/>
  <circle cx="44" cy="44" r="5" stroke="#00ff88" stroke-width="1.5" fill="#030806"/>
  <circle cx="32" cy="32" r="4" fill="#00ff88" opacity="0.9" filter="url(#glow)"/>
  <!-- connections -->
  <line x1="32" y1="25" x2="32" y2="28" stroke="#00ff88" stroke-width="1.5" opacity="0.8"/>
  <line x1="30" y1="34" x2="22" y2="40" stroke="#00ff88" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="34" y1="34" x2="42" y2="40" stroke="#00ff88" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="24" y1="44" x2="40" y2="44" stroke="#00ccff" stroke-width="1" opacity="0.35"/>
  <!-- N letter hint -->
  <path d="M26 18 L26 46 M26 18 L38 46 M38 18 L38 46" stroke="url(#g)" stroke-width="2.5" stroke-linecap="square" opacity="0.25"/>
</svg>
