name: Release Noetis binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: rust

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: noetis-linux-x86_64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset: noetis-macos-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: noetis-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: noetis-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release -p noetis-network --target ${{ matrix.target }}

      - name: Pack (Unix)
        if: runner.os != 'Windows'
        run: |
          stage=dist/bin
          mkdir -p "$stage"
          for b in noetis-app noetis-hub noetis-compute noetis-relay noetis-sync noetis-wallet; do
            cp "target/${{ matrix.target }}/release/$b" "$stage/"
          done
          tar -C dist -czf "${{ matrix.asset }}" bin
          mv "${{ matrix.asset }}" "$GITHUB_WORKSPACE/"

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          foreach ($b in @('noetis-app','noetis-hub','noetis-compute','noetis-relay','noetis-sync','noetis-wallet')) {
            Copy-Item "target\${{ matrix.target }}\release\$b.exe" "dist\bin\$b.exe"
          }
          Compress-Archive -Path dist\bin\* -DestinationPath ${{ matrix.asset }}
          Move-Item ${{ matrix.asset }} $env:GITHUB_WORKSPACE\

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
